<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karta Gracza</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="player-card">
    <!-- TODO: dodaj sekcje karty gracza -->
    <header class="card-header">
      <h1>🎮 Karta Gracza</h1>
      <p>Nick: <span class="highlight">ovoShooter</span></p>
    </header>

    <section class="card-section bio">
      <h2>📝 Bio</h2>
      <p>Poziom: <b>50</b></p>
      <p>Klasa: <b>Łucznik</b></p>
      <p>Gildia: <b>Giganci</b></p>
    </section>

    <section class="card-section eq">
      <h2>⚔ Ekwipunek</h2>
      <ul>
        <li>Łuk z Rogu +7</li>
        <li>Zbroja z czerwonych mrówek</li>
        <li>Pierścień celności</li>
      </ul>
    </section>

    <footer class="card-footer">
      <p>Ostatnia aktywność: <time datetime="2026-10-06">06 października 2026</time></p>
    </footer>

  </main>
</body>
</html>
